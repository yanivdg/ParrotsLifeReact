<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Play A Ruling Role Over Time - ReactApp</title>
  
  <link rel="stylesheet" href="styles.css">

  <style>
    /* 1. Ensure the background container covers the whole screen */
    #video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Behind React content */
      overflow: hidden;
      pointer-events: none; /* User clicks "through" it to your app */
      background: black;
    }

    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
    }

    /* Scaling for different screen sizes */
    @media (min-aspect-ratio: 16/9) { #player { height: 56.25vw; } }
    @media (max-aspect-ratio: 16/9) { #player { width: 177.78vh; } }
  </style>
</head>
<body>

  <!-- 2. Background Video Container -->
  <div id="video-background">
      <div id="player"></div>
  </div>

  <!-- 3. React Root -->
  <div id="root"></div>

  <!-- 4. Hidden/Small UI elements moved from head to body -->
  <div style="position: absolute; top: 0; right: 0; z-index: 10; background: rgba(255,255,255,0.7); font-size: 10px;">
    <div>R-700e7e4</div>
    <img src="data:image/jpeg;base64,..." alt="Small image" width="40" height="40">
  </div>

  <!-- Scripts -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="youtubeScript.js"></script>
  
  <!-- React Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Your App Code -->
  <script src="https://cdn.jsdelivr.net/gh/yanivdg/ReactToken@2a68dce/src/App.js" type="module" crossorigin></script>

</body>
</html>
