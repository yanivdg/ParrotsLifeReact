<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play A Ruling Role Over Time</title>
  
  <link rel="stylesheet" href="styles.css">

  <style>
    #video-background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1; 
      overflow: hidden;
      pointer-events: none;
      background: #000;
    }
    #player {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw; height: 100vh;
      transform: translate(-50%, -50%);
    }
    @media (min-aspect-ratio: 16/9) { #player { height: 56.25vw; } }
    @media (max-aspect-ratio: 16/9) { #player { width: 177.78vh; } }
    
    .metadata-overlay {
      position: fixed;
      top: 10px; left: 10px;
      z-index: 999;
      color: white;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- 1. Background Video -->
  <div id="video-background">
      <div id="player"></div>
  </div>

  <!-- 2. React Mount Point -->
  <div id="root"></div>

  <!-- 3. FIXED: Elements required by renderers.js & stimulus.js -->
  <!-- These are hidden so they don't ruin your UI, but present so scripts don't crash -->
  <div id="success_message" style="display:none;"></div>
  
  <!-- This fixes the 'Missing target element "content"' error -->
  <div data-controller="utilities--read-more" style="display:none;">
      <div data-utilities--read-more-target="content"></div>
  </div>

  <!-- This fixes the tab_controller and explore_nav attribute errors -->
  <nav id="explore_nav" style="display:none;">
      <div class="tab-target" data-target="tab"></div>
  </nav>

  <!-- 4. Versioning/Logo -->
  <div class="metadata-overlay">
    <div>R-2f7ee8b</div>
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRg..." alt="Logo" width="44" height="50">
  </div>

  <!-- 5. Scripts: Ordered to ensure DOM is ready first -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="youtubeScript.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  
  <!-- Your Main App -->
  <script src="https://cdn.jsdelivr.net/gh/yanivdg/ReactToken@2a68dce/src/App.js" type="module"></script>

</body>
</html>
